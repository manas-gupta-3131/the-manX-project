<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — R&D PM Platform</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>R&D<span>PM</span></h1>
      <p>V-Guard R&D Electronics · Project & Resource Management</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@vguard.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    </form>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    btn.textContent = 'Signing in…';
    btn.disabled = true;
    try {
      await API.post('/api/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = '/dashboard';
    } catch (ex) {
      err.textContent = ex.message || 'Invalid credentials';
      err.style.display = 'block';
      btn.textContent = 'Sign in';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
