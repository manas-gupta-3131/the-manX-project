<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}R&D PM Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  {% block head %}{% endblock %}
</head>
<body>

<nav class="topnav">
  <a class="brand" href="/dashboard">R&D<span>PM</span></a>
  <div class="topnav-search">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Search projects, tasks…" id="global-search">
  </div>
  <div class="topnav-spacer"></div>
  <div class="topnav-actions">
    <button class="nav-btn" id="notif-btn" title="Notifications">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div style="position:relative">
      <div class="user-chip" id="user-chip" onclick="toggleUserMenu()" style="cursor:pointer">
        <div class="avatar" id="user-avatar">?</div>
        <span id="user-name">…</span>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div id="user-menu" style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:220px;z-index:300;overflow:hidden">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border-2)">
          <div id="menu-name" style="font-weight:600;font-size:14px;color:var(--text-primary)">…</div>
          <div id="menu-email" style="font-size:12px;color:var(--text-muted);margin-top:2px">…</div>
          <div id="menu-role" style="font-size:11px;margin-top:4px"></div>
        </div>
        <div style="padding:6px 0">
          <a href="/dashboard" style="display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--text-primary);text-decoration:none;transition:background .1s" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Dashboard
          </a>
          <a href="#" onclick="openChangePasswordModal(); toggleUserMenu(); return false;" style="display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--text-primary);text-decoration:none;transition:background .1s" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Change Password
          </a>
          <div style="height:1px;background:var(--border-2);margin:4px 0"></div>
          <a href="#" onclick="doLogout(); return false;" style="display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:#dc2626;text-decoration:none;transition:background .1s" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Navigation</div>
      <a class="sidebar-link" href="/dashboard" id="nav-dashboard">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="sidebar-link" href="/dashboard#projects" id="nav-projects">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
      </a>
    </div>
    <div class="sidebar-section" id="nav-team-section" style="display:none;">
      <div class="sidebar-label">Team</div>
      <a class="sidebar-link" href="/dashboard#teams" id="nav-teams">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Teams & Members
      </a>
      <a class="sidebar-link" href="/dashboard#resources" id="nav-resources">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Resource Health
      </a>
    </div>
    <div class="sidebar-section" id="nav-approvals-section">
      <div class="sidebar-label">Governance</div>
      <a class="sidebar-link" href="/dashboard#approvals" id="nav-approvals">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Approvals
      </a>
    </div>
    <div class="sidebar-section" id="nav-admin-section" style="display:none">
      <div class="sidebar-label">System</div>
      <a class="sidebar-link" href="/dashboard#admin" id="nav-admin" onclick="if(window.switchTab){event.preventDefault();switchTab('admin');}">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Access Control
      </a>
    </div>
    <div class="sidebar-bottom">
      <a class="sidebar-link" href="#" onclick="doLogout(); return false;">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </a>
    </div>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
<script src="/static/js/api.js"></script>
<script>
  (async () => {
    try {
      const me = await API.get('/api/auth/me');
      window.__me = me;
      const roleMap = { vp: 'VP R&D', pm: 'Project Manager', lead: 'Team Lead', member: 'Team Member' };
      document.getElementById('user-name').textContent = me.name;
      document.getElementById('user-avatar').textContent = initials(me.name);
      document.getElementById('menu-name').textContent  = me.name;
      document.getElementById('menu-email').textContent = me.email;
      const roleLabel = roleMap[me.role] || me.role;
      const adminBadge = me.is_admin
        ? `<span style="display:inline-block;padding:2px 8px;background:#7c3aed22;color:#7c3aed;border-radius:20px;font-weight:700;font-size:10px;margin-left:4px;letter-spacing:.5px">ADMIN</span>`
        : '';
      document.getElementById('menu-role').innerHTML =
        `<span style="display:inline-block;padding:2px 8px;background:var(--primary-10,rgba(37,99,235,.12));color:var(--primary);border-radius:20px;font-weight:600">${roleLabel}</span>${adminBadge}`;
      if (['vp', 'pm', 'lead'].includes(me.role)) {
        document.getElementById('nav-team-section').style.display = '';
      }
      if (me.is_admin) {
        document.getElementById('nav-admin-section').style.display = '';
      }
    } catch(e) { window.location.href = '/login'; }
  })();

  function toggleUserMenu() {
    const menu = document.getElementById('user-menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', e => {
    const chip = document.getElementById('user-chip');
    const menu = document.getElementById('user-menu');
    if (menu && chip && !chip.contains(e.target) && !menu.contains(e.target)) {
      menu.style.display = 'none';
    }
  });

  async function doLogout() {
    await API.post('/api/auth/logout');
    window.location.href = '/login';
  }

  function openChangePasswordModal() {
    showModal(`
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="cp-current" placeholder="Enter current password">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="cp-new" placeholder="Min. 8 characters">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="cp-confirm" placeholder="Repeat new password">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>
      </div>
    `);
    setModalTitle('Change Password');
  }

  async function submitChangePassword() {
    const cur  = document.getElementById('cp-current').value;
    const nw   = document.getElementById('cp-new').value;
    const conf = document.getElementById('cp-confirm').value;
    if (!cur || !nw) { toast('All fields required', 'error'); return; }
    if (nw !== conf) { toast('New passwords do not match', 'error'); return; }
    if (nw.length < 8) { toast('Password must be at least 8 characters', 'error'); return; }
    try {
      await API.put('/api/auth/password', { current_password: cur, new_password: nw });
      closeModal();
      toast('Password updated', 'success');
    } catch(e) { toast(e.message, 'error'); }
  }

  // Highlight active sidebar link
  const path = window.location.pathname;
  document.querySelectorAll('.sidebar-link').forEach(a => {
    if (a.getAttribute('href') === path) a.classList.add('active');
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
